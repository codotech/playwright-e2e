<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Repository contract for the Playwright E2E action</title>
  <desc id="description">The consumer owns application lifecycle and supplies a ready base URL. Only the e2e directory containing runner configuration and tests is the action's repository contract. Compose is not required or accepted by the action.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#353535" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28F89A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.32"/>
    </filter>
    <style>
      .heading { font: 700 22px Inter, Geist, Arial, sans-serif; letter-spacing: 1.8px; fill: #28F89A; }
      .subtitle { font: 400 15px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .label { font: 650 17px Inter, Geist, Arial, sans-serif; fill: #F6F6F6; }
      .detail { font: 400 13px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .file { font: 550 13px 'Azeret Mono', 'SFMono-Regular', Consolas, monospace; fill: #F6F6F6; }
      .type { font: 700 11px Inter, Geist, Arial, sans-serif; fill: #181818; letter-spacing: 0.7px; }
      .connector { stroke: #28F89A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="24" fill="#2A2A2A" stroke="#424242" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="558" rx="24" fill="url(#grid)" opacity="0.72"/>

  <text x="50" y="53" class="heading">REPOSITORY CONTRACT</text>
  <text x="50" y="80" class="subtitle">The action is portable; the consuming repository owns these paths and their contents</text>

  <g filter="url(#shadow)">
    <rect x="425" y="110" width="350" height="68" rx="16" fill="#22332F" stroke="#28F89A" stroke-width="2"/>
    <text x="451" y="140" class="label">Consumer repository</text>
    <text x="451" y="161" class="detail">checked out before the action runs</text>
  </g>

  <path d="M600 178 V220 H178 V248" class="connector"/>
  <path d="M600 178 V248" class="connector"/>
  <path d="M600 178 V220 H1022 V248" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="48" y="250" width="260" height="174" rx="16" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <rect x="68" y="270" width="58" height="22" rx="11" fill="#28F89A"/>
    <text x="80" y="285" class="type">ROOT</text>
    <text x="68" y="326" class="label">Caller lifecycle</text>
    <rect x="68" y="346" width="220" height="42" rx="9" fill="#424242"/>
    <text x="84" y="372" class="file">your workflow</text>
    <text x="68" y="408" class="detail">Start · readiness · logs · cleanup</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="250" width="540" height="258" rx="16" fill="#333333" stroke="#28F89A" stroke-width="1.5"/>
    <rect x="350" y="270" width="92" height="22" rx="11" fill="#28F89A"/>
    <text x="365" y="285" class="type">E2E DIR</text>
    <text x="350" y="326" class="label">Runner, policy, and tests</text>

    <rect x="350" y="346" width="150" height="42" rx="9" fill="#424242"/>
    <text x="366" y="372" class="file">ci.yml</text>
    <rect x="516" y="346" width="150" height="42" rx="9" fill="#424242"/>
    <text x="532" y="372" class="file">Dockerfile</text>
    <rect x="682" y="346" width="168" height="42" rx="9" fill="#424242"/>
    <text x="698" y="372" class="file">runner-entrypoint</text>

    <rect x="350" y="402" width="150" height="42" rx="9" fill="#424242"/>
    <text x="366" y="428" class="file">package.json</text>
    <rect x="516" y="402" width="150" height="42" rx="9" fill="#424242"/>
    <text x="532" y="428" class="file">pnpm-lock.yaml</text>
    <rect x="682" y="402" width="168" height="42" rx="9" fill="#424242"/>
    <text x="698" y="428" class="file">playwright.config</text>

    <rect x="350" y="458" width="500" height="30" rx="9" fill="#22332F" stroke="#28F89A"/>
    <text x="366" y="479" class="file">tests/</text>
    <text x="440" y="479" class="detail">suites · fixtures · helpers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="892" y="250" width="260" height="174" rx="16" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <rect x="912" y="270" width="60" height="22" rx="11" fill="#28F89A"/>
    <text x="926" y="285" class="type">SUT</text>
    <text x="912" y="326" class="label">Ready target URL</text>
    <rect x="912" y="346" width="220" height="42" rx="9" fill="#424242"/>
    <text x="928" y="372" class="file">sut.baseUrl</text>
    <text x="912" y="408" class="detail">Local or remote; caller-managed</text>
  </g>

  <text x="50" y="533" class="subtitle">The directory name and manifest path stay stable; implementation details remain application-owned.</text>
</svg>
