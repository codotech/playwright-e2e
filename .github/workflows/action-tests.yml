name: Action tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sut-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify external and Compose SUT lifecycles
        run: node --test .github/tests/*.test.mjs
