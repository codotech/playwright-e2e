name: Action tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  url-only-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify URL-only planning and runner results
        run: node --test .github/tests/*.test.mjs
