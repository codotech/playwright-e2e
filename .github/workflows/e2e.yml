name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: Execution profile from e2e/ci.yml.
        required: true
        default: regression
        type: string
      projects:
        description: Optional project override, one per line.
        required: false
        default: ""
        type: string
      labels:
        description: Optional label override, one per line.
        required: false
        default: ""
        type: string
      label-match:
        description: Optional label matching override.
        required: false
        default: profile
        type: choice
        options:
          - profile
          - all
          - any

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E pipeline
    uses: $/.github/workflows/reusable-e2e.yml
    with:
      config-file: e2e/ci.yml
      profile: >-
        ${{ github.event_name == 'pull_request' && 'pull-request' ||
        github.event_name == 'push' && 'main' || inputs.profile }}
      projects: ${{ github.event_name == 'workflow_dispatch' && inputs.projects || '' }}
      labels: ${{ github.event_name == 'workflow_dispatch' && inputs.labels || '' }}
      label-match: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.label-match != 'profile' &&
        inputs.label-match || '' }}
