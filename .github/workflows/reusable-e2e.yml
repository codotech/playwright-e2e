name: Reusable E2E

on:
  workflow_call:
    inputs:
      profile:
        description: Named execution profile from the E2E manifest.
        required: false
        default: pull-request
        type: string
      projects:
        description: Optional newline-delimited project override; empty uses the profile.
        required: false
        default: ""
        type: string
      labels:
        description: Optional newline-delimited label override; empty uses the profile.
        required: false
        default: ""
        type: string
      label-match:
        description: Optional label matching override, either all or any.
        required: false
        default: ""
        type: string
      comment-on-pr:
        description: Create or update one E2E report comment on same-repository pull requests.
        required: false
        default: true
        type: boolean
    outputs:
      runner-image-name:
        description: Exact local E2E runner image reference used by every shard.
        value: ${{ jobs.build_runner.outputs.image-name }}
      runner-image-id:
        description: Content-addressed E2E runner Docker image ID.
        value: ${{ jobs.build_runner.outputs.image-id }}
      runner-image-artifact:
        description: Artifact containing the portable E2E runner Docker archive.
        value: ${{ jobs.build_runner.outputs.artifact-name }}
      runner-cache-hit:
        description: Whether the runner archive was restored by E2E content hash.
        value: ${{ jobs.build_runner.outputs.cache-hit }}
      runner-content-hash:
        description: SHA-256 of the E2E runtime and build inputs used by the runner.
        value: ${{ jobs.plan.outputs.runner-content-hash }}
      profile:
        description: Effective E2E execution profile.
        value: ${{ jobs.plan.outputs.profile }}
      report-image-name:
        description: Local image reference for the packaged E2E HTML report.
        value: ${{ jobs.merge.outputs.report-image-name }}
      report-image-id:
        description: Content-addressed E2E report Docker image ID.
        value: ${{ jobs.merge.outputs.report-image-id }}
      report-image-artifact:
        description: Artifact containing the portable E2E report Docker archive.
        value: ${{ jobs.merge.outputs.report-image-artifact }}
      verdict:
        description: Authoritative E2E verdict.
        value: ${{ jobs.e2e_gate.outputs.verdict }}
      artifact-name:
        description: Name of the merged evidence artifact.
        value: ${{ jobs.merge.outputs.artifact-name }}
      total:
        description: Total number of tests in the merged report.
        value: ${{ jobs.merge.outputs.total }}
      passed:
        description: Number of passing tests in the merged report.
        value: ${{ jobs.merge.outputs.passed }}
      failed:
        description: Number of failing tests in the merged report.
        value: ${{ jobs.merge.outputs.failed }}
      skipped:
        description: Number of skipped tests in the merged report.
        value: ${{ jobs.merge.outputs.skipped }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan E2E shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      working-directory: ${{ steps.plan.outputs.working-directory }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      playwright-config: ${{ steps.plan.outputs.playwright-config }}
      compose-file: ${{ steps.plan.outputs.compose-file }}
      base-url: ${{ steps.plan.outputs.base-url }}
      projects: ${{ steps.plan.outputs.projects }}
      labels: ${{ steps.plan.outputs.labels }}
      label-match: ${{ steps.plan.outputs.label-match }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact-retention-days: ${{ steps.plan.outputs.artifact-retention-days }}
      runner-content-hash: ${{ steps.plan.outputs.runner-content-hash }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: plan
        name: Validate E2E execution manifest
        uses: $/.github/actions/plan-e2e
        with:
          profile: ${{ inputs.profile }}
          projects: ${{ inputs.projects }}
          labels: ${{ inputs.labels }}
          label-match: ${{ inputs.label-match }}

  build_runner:
    name: Resolve E2E runner image
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-runner-${{ github.event.pull_request.number || github.ref }}-${{ needs.plan.outputs.runner-content-hash }}
      cancel-in-progress: false
    outputs:
      image-name: ${{ steps.reuse.outputs.image-name || steps.build.outputs.image-name }}
      image-id: ${{ steps.reuse.outputs.image-id || steps.build.outputs.image-id }}
      artifact-name: ${{ steps.upload-runner.outcome == 'success' && 'e2e-runner-image' || '' }}
      cache-hit: ${{ steps.reuse.outcome == 'success' }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: runner-cache
        name: Restore E2E runner archive
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-runner
          key: e2e-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.runner-content-hash }}

      - id: reuse
        name: Validate cached E2E runner image
        if: steps.runner-cache.outcome == 'success' && steps.runner-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        uses: $/.github/actions/validate-e2e-runner
        with:
          archive-path: .e2e-runner/playwright-e2e-runner.tar.zst
          image-name: playwright-e2e-runner:e2e-${{ needs.plan.outputs.runner-content-hash }}
          content-hash: ${{ needs.plan.outputs.runner-content-hash }}

      - id: build
        name: Build E2E runner image
        if: >-
          always() && !cancelled() && steps.runner-cache.outcome != 'skipped' &&
          steps.reuse.outcome != 'success'
        uses: $/.github/actions/build-e2e-runner
        with:
          working-directory: ${{ needs.plan.outputs.working-directory }}
          dockerfile: ${{ needs.plan.outputs.dockerfile }}
          image-name: playwright-e2e-runner:e2e-${{ needs.plan.outputs.runner-content-hash }}
          archive-path: .e2e-runner/playwright-e2e-runner.tar.zst
          content-hash: ${{ needs.plan.outputs.runner-content-hash }}

      - id: upload-runner
        name: Upload portable E2E runner image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-runner-image
          path: ${{ steps.reuse.outputs.archive-path || steps.build.outputs.archive-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.plan.outputs.artifact-retention-days }}

  shards:
    name: E2E shard ${{ matrix.shard }}/${{ needs.plan.outputs.shard-count }}
    needs:
      - plan
      - build_runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: download-runner
        name: Download E2E runner image
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build_runner.outputs.artifact-name }}
          path: runner-image

      - id: load-runner
        name: Load E2E runner image
        continue-on-error: true
        shell: bash
        run: docker load --input runner-image/playwright-e2e-runner.tar.zst

      - id: run
        name: Run Playwright shard
        continue-on-error: true
        uses: $/.github/actions/run-e2e
        with:
          working-directory: ${{ needs.plan.outputs.working-directory }}
          playwright-config: ${{ needs.plan.outputs.playwright-config }}
          compose-file: ${{ needs.plan.outputs.compose-file }}
          base-url: ${{ needs.plan.outputs.base-url }}
          runner-image-name: ${{ needs.build_runner.outputs.image-name }}
          runner-image-id: ${{ needs.build_runner.outputs.image-id }}
          runner-download-outcome: ${{ steps.download-runner.outcome }}
          runner-load-outcome: ${{ steps.load-runner.outcome }}
          projects: ${{ needs.plan.outputs.projects }}
          labels: ${{ needs.plan.outputs.labels }}
          label-match: ${{ needs.plan.outputs.label-match }}
          shard-index: ${{ matrix.shard }}
          shard-total: ${{ needs.plan.outputs.shard-count }}
          results-directory: test-results

      - name: Upload shard evidence
        if: always() && steps.run.outputs.shard-directory != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: ${{ steps.run.outputs.shard-directory }}
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.artifact-retention-days }}

      - name: Preserve shard verdict
        if: >-
          always() && (steps.download-runner.outcome != 'success' ||
          steps.load-runner.outcome != 'success' ||
          steps.run.outcome != 'success')
        shell: bash
        run: |
          echo "::error::E2E shard ${{ matrix.shard }} did not complete successfully"
          exit 1

  merge:
    name: Merge E2E evidence
    needs:
      - plan
      - build_runner
      - shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
      artifact-name: ${{ steps.publish.outputs.artifact-name }}
      total: ${{ steps.publish.outputs.total }}
      passed: ${{ steps.publish.outputs.passed }}
      failed: ${{ steps.publish.outputs.failed }}
      skipped: ${{ steps.publish.outputs.skipped }}
      report-image-name: ${{ steps.package-report.outcome == 'success' && steps.package-report.outputs.image-name || '' }}
      report-image-id: ${{ steps.package-report.outcome == 'success' && steps.package-report.outputs.image-id || '' }}
      report-image-artifact: ${{ steps.package-report.outcome == 'success' && steps.package-report.outputs.artifact-name || '' }}
    steps:
      - id: download-runner
        name: Download E2E runner image
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-runner-image
          path: runner-image

      - id: load-runner
        name: Load E2E runner image
        continue-on-error: true
        shell: bash
        run: docker load --input runner-image/playwright-e2e-runner.tar.zst

      - id: verify-runner
        name: Verify immutable E2E runner image
        continue-on-error: true
        shell: bash
        env:
          E2E_RUNNER_IMAGE_NAME: ${{ needs.build_runner.outputs.image-name }}
          E2E_RUNNER_IMAGE_ID: ${{ needs.build_runner.outputs.image-id }}
        run: |
          set -euo pipefail
          if [[ -z "$E2E_RUNNER_IMAGE_NAME" ]]; then
            echo "Expected E2E runner image name is empty" >&2
            exit 1
          fi
          if [[ ! "$E2E_RUNNER_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid expected E2E runner image ID: $E2E_RUNNER_IMAGE_ID" >&2
            exit 1
          fi
          actual_image_id="$(docker image inspect --format '{{.Id}}' "$E2E_RUNNER_IMAGE_NAME")"
          if [[ "$actual_image_id" != "$E2E_RUNNER_IMAGE_ID" ]]; then
            echo "E2E runner image ID mismatch: expected $E2E_RUNNER_IMAGE_ID, got $actual_image_id" >&2
            exit 1
          fi

      - id: download
        name: Download shard evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-shard-*
          path: downloaded-shards
          merge-multiple: false

      - id: merge
        name: Merge E2E evidence
        if: always()
        continue-on-error: true
        uses: $/.github/actions/merge-e2e-evidence
        with:
          download-directory: downloaded-shards
          evidence-directory: e2e-evidence
          expected-shards: ${{ needs.plan.outputs.shard-count }}
          runner-image-id: ${{ needs.build_runner.outputs.image-id }}

      - id: package-report
        name: Package E2E report image
        if: always()
        continue-on-error: true
        uses: $/.github/actions/package-e2e-report
        with:
          report-directory: e2e-evidence/playwright-report
          image-name: playwright-e2e-report:${{ github.run_id }}-${{ github.run_attempt }}
          archive-directory: e2e-report-image
          artifact-name: e2e-report-image
          retention-days: ${{ needs.plan.outputs.artifact-retention-days }}

      - id: publish
        name: Publish and enforce authoritative evidence
        if: always()
        continue-on-error: true
        uses: $/.github/actions/publish-e2e-evidence
        with:
          evidence-directory: e2e-evidence
          expected-shards: ${{ needs.plan.outputs.shard-count }}
          artifact-name: e2e-evidence
          retention-days: ${{ needs.plan.outputs.artifact-retention-days }}
          runner-download-outcome: ${{ steps.download-runner.outcome }}
          runner-load-outcome: ${{ steps.load-runner.outcome }}
          runner-verification-outcome: ${{ steps.verify-runner.outcome }}
          shard-download-outcome: ${{ steps.download.outcome }}
          merge-outcome: ${{ steps.merge.outcome }}
          report-publication-outcome: ${{ steps.package-report.outcome }}

      - name: Preserve merge verdict
        if: always() && steps.publish.outcome != 'success'
        shell: bash
        run: |
          echo "::error::E2E evidence could not be completed successfully"
          exit 1

  e2e_gate:
    name: E2E Gate
    needs:
      - plan
      - shards
      - merge
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.finalize.outputs.verdict }}
      primary-failure: ${{ steps.finalize.outputs.primary-failure }}
    steps:
      - id: download
        name: Download authoritative evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-evidence
          path: final-evidence

      - id: finalize
        name: Enforce authoritative verdict
        uses: $/.github/actions/finalize-e2e-verdict
        with:
          verdict-file: final-evidence/verdict.json
          shard-job-result: ${{ needs.shards.result }}
          merge-job-result: ${{ needs.merge.result }}
          publication-result: ${{ steps.download.outcome }}

  pr_comment:
    name: E2E PR report
    needs:
      - plan
      - build_runner
      - merge
      - e2e_gate
    if: >-
      ${{ always() && inputs.comment-on-pr && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Create or update E2E report
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          E2E_GATE_JOB_RESULT: ${{ needs.e2e_gate.result }}
          E2E_GATE_VERDICT: ${{ needs.e2e_gate.outputs.verdict }}
          E2E_MERGE_VERDICT: ${{ needs.merge.outputs.verdict }}
          E2E_PRIMARY_FAILURE: ${{ needs.e2e_gate.outputs.primary-failure }}
          E2E_TOTAL: ${{ needs.merge.outputs.total }}
          E2E_PASSED: ${{ needs.merge.outputs.passed }}
          E2E_FAILED: ${{ needs.merge.outputs.failed }}
          E2E_SKIPPED: ${{ needs.merge.outputs.skipped }}
          E2E_ARTIFACT_NAME: ${{ needs.merge.outputs.artifact-name }}
          E2E_RUNNER_IMAGE_NAME: ${{ needs.build_runner.outputs.image-name }}
          E2E_RUNNER_IMAGE_ID: ${{ needs.build_runner.outputs.image-id }}
          E2E_RUNNER_IMAGE_ARTIFACT: ${{ needs.build_runner.outputs.artifact-name }}
          E2E_RUNNER_CACHE_HIT: ${{ needs.build_runner.outputs.cache-hit }}
          E2E_REPORT_IMAGE_NAME: ${{ needs.merge.outputs.report-image-name }}
          E2E_REPORT_IMAGE_ID: ${{ needs.merge.outputs.report-image-id }}
          E2E_REPORT_IMAGE_ARTIFACT: ${{ needs.merge.outputs.report-image-artifact }}
          E2E_PROFILE: ${{ needs.plan.outputs.profile }}
          E2E_PROJECTS: ${{ needs.plan.outputs.projects }}
          E2E_LABELS: ${{ needs.plan.outputs.labels }}
          E2E_LABEL_MATCH: ${{ needs.plan.outputs.label-match }}
        with:
          script: |
            const marker = '<!-- playwright-e2e-ci-report -->';
            const clean = (value, fallback) => {
              const normalized = String(value ?? '').trim();
              return normalized || fallback;
            };
            const cell = (value) => String(value).replaceAll('|', '\\|').replaceAll('\n', '<br>');
            const list = (value, fallback) => {
              const entries = String(value ?? '')
                .split(/\r?\n/)
                .map((entry) => entry.trim())
                .filter(Boolean);
              return entries.length > 0 ? entries.map((entry) => `\`${entry}\``).join(', ') : fallback;
            };

            const gateResult = clean(process.env.E2E_GATE_JOB_RESULT, 'failure');
            const verdict = clean(
              process.env.E2E_GATE_VERDICT,
              clean(process.env.E2E_MERGE_VERDICT, gateResult === 'success' ? 'passed' : 'infrastructure-error'),
            );
            const passed = verdict === 'passed';
            const status = passed ? '✅ Passed' : verdict === 'failed' ? '❌ Tests failed' : '⚠️ Infrastructure error';
            const total = clean(process.env.E2E_TOTAL, 'unknown');
            const passedCount = clean(process.env.E2E_PASSED, 'unknown');
            const failedCount = clean(process.env.E2E_FAILED, 'unknown');
            const skippedCount = clean(process.env.E2E_SKIPPED, 'unknown');
            const profile = clean(process.env.E2E_PROFILE, 'unknown');
            const projects = list(process.env.E2E_PROJECTS, 'All configured projects');
            const labels = list(process.env.E2E_LABELS, 'All labels');
            const labelMatch = clean(process.env.E2E_LABEL_MATCH, 'all');
            const artifactName = clean(process.env.E2E_ARTIFACT_NAME, 'e2e-evidence');
            const runnerImageName = clean(process.env.E2E_RUNNER_IMAGE_NAME, 'unavailable');
            const runnerImageId = clean(process.env.E2E_RUNNER_IMAGE_ID, 'unavailable');
            const runnerImageArtifact = clean(process.env.E2E_RUNNER_IMAGE_ARTIFACT, 'unavailable');
            const runnerSource = runnerImageName === 'unavailable'
              ? 'unavailable'
              : clean(process.env.E2E_RUNNER_CACHE_HIT, '') === 'true' ? 'cache hit' : 'built';
            const reportImageName = clean(process.env.E2E_REPORT_IMAGE_NAME, 'unavailable');
            const reportImageId = clean(process.env.E2E_REPORT_IMAGE_ID, 'unavailable');
            const reportImageArtifact = clean(process.env.E2E_REPORT_IMAGE_ARTIFACT, 'unavailable');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const lines = [
              marker,
              '## E2E confidence report',
              '',
              '| Signal | Result |',
              '| --- | --- |',
              `| Gate | ${status} |`,
              `| Tests | ${cell(`${passedCount} passed · ${failedCount} failed · ${skippedCount} skipped · ${total} total`)} |`,
              `| Profile | ${cell(`\`${profile}\``)} |`,
              `| Projects | ${cell(projects)} |`,
              `| Labels | ${cell(`${labels} · match ${labelMatch}`)} |`,
              '| SUT | Docker Compose, isolated per shard |',
              `| Runner image | ${cell(`\`${runnerImageName}\` · \`${runnerImageId}\` · \`${runnerImageArtifact}\` · ${runnerSource}`)} |`,
              `| Report image | ${cell(`\`${reportImageName}\` · \`${reportImageId}\` · \`${reportImageArtifact}\``)} |`,
              `| Evidence | [Open workflow run](${runUrl}) · \`${cell(artifactName)}\` |`,
            ];

            const primaryFailure = clean(process.env.E2E_PRIMARY_FAILURE, '');
            if (!passed && primaryFailure) {
              lines.push('', `> ${primaryFailure.replaceAll('\n', '\n> ')}`);
            }
            lines.push('', `_Updated from run ${context.runId}._`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
