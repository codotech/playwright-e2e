name: Merge E2E Evidence
description: Validate all shard evidence, merge reports, publish evidence, and fail closed.

inputs:
  working-directory:
    description: Repository-relative directory containing the installed Playwright package.
    required: false
    default: e2e
  download-directory:
    description: Repository-relative directory containing downloaded shard artifacts.
    required: false
    default: downloaded-shards
  evidence-directory:
    description: Repository-relative directory where merged evidence is assembled.
    required: false
    default: e2e-evidence
  expected-shards:
    description: Number of shard status files and report sets required.
    required: true
  artifact-name:
    description: Name of the durable merged evidence artifact.
    required: false
    default: e2e-evidence
  retention-days:
    description: Number of days GitHub retains the merged evidence artifact.
    required: false
    default: "10"

outputs:
  verdict:
    description: "Authoritative verdict: passed, failed, or infrastructure-error."
    value: ${{ steps.evaluate.outputs.verdict }}
  artifact-name:
    description: Merged evidence artifact name.
    value: ${{ inputs.artifact-name }}
  total:
    description: Aggregated test count.
    value: ${{ steps.evaluate.outputs.total }}
  passed:
    description: Aggregated passed test count.
    value: ${{ steps.evaluate.outputs.passed }}
  failed:
    description: Aggregated failed test count.
    value: ${{ steps.evaluate.outputs.failed }}
  skipped:
    description: Aggregated skipped test count.
    value: ${{ steps.evaluate.outputs.skipped }}
  verdict-file:
    description: Absolute path to verdict.json.
    value: ${{ steps.evaluate.outputs.verdict-file }}

runs:
  using: composite
  steps:
    - name: Stage and validate shard evidence
      id: stage
      shell: bash
      env:
        E2E_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        E2E_DOWNLOAD_DIRECTORY: ${{ inputs.download-directory }}
        E2E_EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        E2E_EXPECTED_SHARDS: ${{ inputs.expected-shards }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/stage-evidence.mjs" \
          "$GITHUB_WORKSPACE" \
          "$E2E_WORKING_DIRECTORY" \
          "$E2E_DOWNLOAD_DIRECTORY" \
          "$E2E_EVIDENCE_DIRECTORY" \
          "$E2E_EXPECTED_SHARDS" \
          "$GITHUB_OUTPUT"

    - name: Merge Playwright blob reports
      id: merge-html
      if: always()
      continue-on-error: true
      shell: bash
      env:
        E2E_CAN_MERGE: ${{ steps.stage.outputs.can-merge }}
        E2E_WORKING_DIRECTORY: ${{ steps.stage.outputs.working-directory }}
        E2E_BLOB_DIRECTORY: ${{ steps.stage.outputs.blob-directory }}
        PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ steps.stage.outputs.html-directory }}
        PLAYWRIGHT_HTML_OPEN: never
      run: |
        set +e
        exit_code=0

        if [[ "$E2E_CAN_MERGE" != "true" ]]; then
          echo "Blob report merge cannot run because shard evidence is incomplete."
          exit_code=42
        else
          (
            cd "$E2E_WORKING_DIRECTORY"
            pnpm exec playwright merge-reports --reporter html "$E2E_BLOB_DIRECTORY"
          )
          exit_code=$?
        fi

        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        exit "$exit_code"

    - name: Assemble deterministic evidence
      id: assemble
      if: always()
      shell: bash
      env:
        E2E_EVIDENCE_DIRECTORY: ${{ steps.stage.outputs.evidence-directory }}
        E2E_EXPECTED_SHARDS: ${{ inputs.expected-shards }}
        E2E_HTML_MERGE_EXIT_CODE: ${{ steps.merge-html.outputs.exit-code }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/assemble-evidence.mjs" \
          "$E2E_EVIDENCE_DIRECTORY" \
          "$E2E_EXPECTED_SHARDS" \
          "${E2E_HTML_MERGE_EXIT_CODE:-99}"

    - name: Upload merged E2E evidence
      id: publish
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.stage.outputs.evidence-directory }}/
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Publish summary and enforce verdict
      id: evaluate
      if: always()
      shell: bash
      env:
        E2E_EVIDENCE_DIRECTORY: ${{ steps.stage.outputs.evidence-directory }}
        E2E_EXPECTED_SHARDS: ${{ inputs.expected-shards }}
        E2E_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        E2E_PUBLICATION_OUTCOME: ${{ steps.publish.outcome }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/evaluate-verdict.mjs" \
          "$E2E_EVIDENCE_DIRECTORY" \
          "$E2E_EXPECTED_SHARDS" \
          "$E2E_ARTIFACT_NAME" \
          "${E2E_PUBLICATION_OUTCOME:-failure}" \
          "$GITHUB_STEP_SUMMARY" \
          "$GITHUB_OUTPUT"
