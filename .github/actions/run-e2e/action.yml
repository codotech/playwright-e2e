name: Run E2E Shard
description: Run one Playwright shard and always leave machine-readable shard results.

inputs:
  working-directory:
    description: Repository-relative directory containing the E2E package.
    required: false
    default: e2e
  playwright-config:
    description: Path to the Playwright configuration, relative to working-directory.
    required: false
    default: playwright.config.ts
  compose-file:
    description: Optional Docker Compose file for the SUT; empty targets the base URL without managing services.
    required: false
    default: ""
  base-url:
    description: Base URL of the Compose-managed or externally managed SUT.
    required: false
    default: http://127.0.0.1:4173
  runner-image-name:
    description: Exact local Docker image reference loaded from the runner artifact.
    required: true
  runner-image-id:
    description: Expected content-addressed Docker image ID.
    required: true
  runner-download-outcome:
    description: Outcome of the workflow step that downloaded the runner image artifact.
    required: true
  runner-load-outcome:
    description: Outcome of the workflow step that loaded the runner image archive.
    required: true
  projects:
    description: Newline-delimited Playwright project names; empty selects all projects.
    required: false
    default: ""
  labels:
    description: Newline-delimited Playwright tags beginning with @; empty selects all tags.
    required: false
    default: ""
  label-match:
    description: Label matching mode, either all or any.
    required: false
    default: all
  shard-index:
    description: One-based shard index.
    required: true
  shard-total:
    description: Total number of shards.
    required: true
  results-directory:
    description: Results path relative to working-directory.
    required: false
    default: test-results

outputs:
  result:
    description: "Shard result: passed, failed, or infrastructure-error."
    value: ${{ steps.finalize.outputs.result }}
  exit-code:
    description: Effective shard exit code after SUT, Playwright, results, and cleanup checks.
    value: ${{ steps.finalize.outputs.exit-code }}
  shard-directory:
    description: Absolute path containing this shard's results.
    value: ${{ steps.initialize.outputs.shard-directory }}
  status-file:
    description: Absolute path to this shard's status JSON.
    value: ${{ steps.initialize.outputs.status-file }}

runs:
  using: composite
  steps:
    - name: Initialize shard results
      id: initialize
      shell: bash
      env:
        E2E_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        E2E_PLAYWRIGHT_CONFIG: ${{ inputs.playwright-config }}
        E2E_COMPOSE_FILE: ${{ inputs.compose-file }}
        E2E_BASE_URL: ${{ inputs.base-url }}
        E2E_RUNNER_IMAGE_NAME: ${{ inputs.runner-image-name }}
        E2E_RUNNER_IMAGE_ID: ${{ inputs.runner-image-id }}
        E2E_RUNNER_DOWNLOAD_OUTCOME: ${{ inputs.runner-download-outcome }}
        E2E_RUNNER_LOAD_OUTCOME: ${{ inputs.runner-load-outcome }}
        E2E_PROJECTS: ${{ inputs.projects }}
        E2E_LABELS: ${{ inputs.labels }}
        E2E_LABEL_MATCH: ${{ inputs.label-match }}
        E2E_SHARD_INDEX: ${{ inputs.shard-index }}
        E2E_SHARD_TOTAL: ${{ inputs.shard-total }}
        E2E_RESULTS_DIRECTORY: ${{ inputs.results-directory }}
      run: |
        set -euo pipefail

        eval "$(node "$GITHUB_ACTION_PATH/prepare-shard.mjs" \
          "$GITHUB_WORKSPACE" \
          "$E2E_WORKING_DIRECTORY" \
          "$E2E_PLAYWRIGHT_CONFIG" \
          "$E2E_COMPOSE_FILE" \
          "$E2E_BASE_URL" \
          "$E2E_RUNNER_IMAGE_NAME" \
          "$E2E_RUNNER_IMAGE_ID" \
          "$E2E_RUNNER_DOWNLOAD_OUTCOME" \
          "$E2E_RUNNER_LOAD_OUTCOME" \
          "$E2E_PROJECTS" \
          "$E2E_LABELS" \
          "$E2E_LABEL_MATCH" \
          "$E2E_SHARD_INDEX" \
          "$E2E_SHARD_TOTAL" \
          "$E2E_RESULTS_DIRECTORY")"

        {
          echo "working-directory=$E2E_ABSOLUTE_WORKING_DIRECTORY"
          echo "config=$E2E_CONTAINER_CONFIG"
          echo "compose-file=$E2E_ABSOLUTE_COMPOSE_FILE"
          echo "base-url=$E2E_BASE_URL"
          echo "compose-project=$E2E_COMPOSE_PROJECT"
          echo "runner-image-name=$E2E_RUNNER_IMAGE_NAME"
          echo "runner-image-id=$E2E_RUNNER_IMAGE_ID"
          echo "selection-file=$E2E_SELECTION_FILE"
          echo "shard-directory=$E2E_SHARD_DIRECTORY"
          echo "status-file=$E2E_STATUS_FILE"
        } >> "$GITHUB_OUTPUT"

    - name: Verify loaded E2E runner image
      id: runner
      if: >-
        always() && steps.initialize.outcome == 'success' &&
        inputs.runner-download-outcome == 'success' &&
        inputs.runner-load-outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        E2E_RUNNER_IMAGE_NAME: ${{ steps.initialize.outputs.runner-image-name }}
        E2E_RUNNER_IMAGE_ID: ${{ steps.initialize.outputs.runner-image-id }}
        E2E_SHARD_DIRECTORY: ${{ steps.initialize.outputs.shard-directory }}
      run: |
        set +e
        runner_log="$E2E_SHARD_DIRECTORY/runner-image.log"
        actual_image_id="$(docker image inspect \
          --format '{{.Id}}' "$E2E_RUNNER_IMAGE_NAME" 2> "$runner_log")"
        runner_exit_code=$?

        if [[ "$runner_exit_code" -eq 0 && "$actual_image_id" != "$E2E_RUNNER_IMAGE_ID" ]]; then
          echo "Runner image ID mismatch: expected $E2E_RUNNER_IMAGE_ID, got $actual_image_id" \
            >> "$runner_log"
          runner_exit_code=42
        fi

        cat "$runner_log"
        {
          echo "exit-code=$runner_exit_code"
          echo "actual-image-id=$actual_image_id"
        } >> "$GITHUB_OUTPUT"
        exit "$runner_exit_code"

    - name: Start Dockerized SUT
      id: start
      if: >-
        always() && steps.initialize.outcome == 'success' &&
        steps.runner.outputs.exit-code == '0' && inputs.compose-file != ''
      continue-on-error: true
      shell: bash
      env:
        E2E_COMPOSE_FILE: ${{ steps.initialize.outputs.compose-file }}
        E2E_COMPOSE_PROJECT: ${{ steps.initialize.outputs.compose-project }}
        E2E_SHARD_DIRECTORY: ${{ steps.initialize.outputs.shard-directory }}
      run: |
        set +e
        set -uo pipefail
        startup_log="$E2E_SHARD_DIRECTORY/docker-compose-startup.log"
        docker compose \
          --file "$E2E_COMPOSE_FILE" \
          --project-name "$E2E_COMPOSE_PROJECT" \
          up --detach --build --wait > "$startup_log" 2>&1
        startup_exit_code=$?
        cat "$startup_log"
        echo "exit-code=$startup_exit_code" >> "$GITHUB_OUTPUT"
        exit "$startup_exit_code"

    - name: Run Playwright shard
      id: playwright
      if: >-
        steps.initialize.outcome == 'success' &&
        steps.runner.outputs.exit-code == '0' &&
        (inputs.compose-file == '' || steps.start.outputs.exit-code == '0')
      continue-on-error: true
      shell: bash
      env:
        E2E_CONFIG: ${{ steps.initialize.outputs.config }}
        E2E_BASE_URL: ${{ steps.initialize.outputs.base-url }}
        E2E_RUNNER_IMAGE_ID: ${{ steps.runner.outputs.actual-image-id }}
        E2E_SHARD_DIRECTORY: ${{ steps.initialize.outputs.shard-directory }}
        E2E_SELECTION_FILE: ${{ steps.initialize.outputs.selection-file }}
        E2E_SHARD_INDEX: ${{ inputs.shard-index }}
        E2E_SHARD_TOTAL: ${{ inputs.shard-total }}
      run: |
        set +e
        selection_args_file="$E2E_SHARD_DIRECTORY/.playwright-selection-args"
        node "$GITHUB_ACTION_PATH/playwright-selection.mjs" \
          emit-args "$E2E_SELECTION_FILE" > "$selection_args_file"
        selection_exit_code=$?
        if [[ "$selection_exit_code" -ne 0 ]]; then
          echo "exit-code=$selection_exit_code" >> "$GITHUB_OUTPUT"
          echo "failure-kind=selection" >> "$GITHUB_OUTPUT"
          exit "$selection_exit_code"
        fi

        playwright_selection_args=()
        while IFS= read -r -d '' argument; do
          playwright_selection_args+=("$argument")
        done < "$selection_args_file"
        (
          docker run --rm \
            --init \
            --network=host \
            --ipc=host \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --pids-limit=1024 \
            --user "$(id -u):$(id -g)" \
            --env BASE_URL="$E2E_BASE_URL" \
            --env CI=true \
            --env HOME=/tmp \
            --env E2E_RESULTS_DIR=/test-output/test-results \
            --env PLAYWRIGHT_BLOB_OUTPUT_DIR=/test-output/blob-report \
            --env PLAYWRIGHT_OUTPUT_DIR=/test-output/test-results \
            --env CTRF_OUTPUT_FILE=/test-output/ctrf/ctrf-report.json \
            --volume "$E2E_SHARD_DIRECTORY:/test-output" \
            "$E2E_RUNNER_IMAGE_ID" \
            --config "$E2E_CONFIG" \
            --shard="$E2E_SHARD_INDEX/$E2E_SHARD_TOTAL" \
            "${playwright_selection_args[@]}"
        )
        playwright_exit_code=$?
        echo "exit-code=$playwright_exit_code" >> "$GITHUB_OUTPUT"
        if [[ "$playwright_exit_code" =~ ^12[567]$ ]] || \
          [[ "$playwright_exit_code" -ge 128 ]]; then
          echo "failure-kind=runner-container" >> "$GITHUB_OUTPUT"
        else
          echo "failure-kind=test" >> "$GITHUB_OUTPUT"
        fi
        exit "$playwright_exit_code"

    - name: Capture Dockerized SUT logs
      id: logs
      if: always() && steps.initialize.outcome == 'success' && inputs.compose-file != ''
      continue-on-error: true
      shell: bash
      env:
        E2E_COMPOSE_FILE: ${{ steps.initialize.outputs.compose-file }}
        E2E_COMPOSE_PROJECT: ${{ steps.initialize.outputs.compose-project }}
        E2E_SHARD_DIRECTORY: ${{ steps.initialize.outputs.shard-directory }}
      run: |
        set +e
        service_log="$E2E_SHARD_DIRECTORY/docker-compose.log"
        docker compose \
          --file "$E2E_COMPOSE_FILE" \
          --project-name "$E2E_COMPOSE_PROJECT" \
          logs --no-color --timestamps > "$service_log" 2>&1
        log_exit_code=$?
        cat "$service_log"
        echo "exit-code=$log_exit_code" >> "$GITHUB_OUTPUT"
        exit "$log_exit_code"

    - name: Tear down Dockerized SUT
      id: teardown
      if: always() && steps.initialize.outcome == 'success' && inputs.compose-file != ''
      continue-on-error: true
      shell: bash
      env:
        E2E_COMPOSE_FILE: ${{ steps.initialize.outputs.compose-file }}
        E2E_COMPOSE_PROJECT: ${{ steps.initialize.outputs.compose-project }}
        E2E_SHARD_DIRECTORY: ${{ steps.initialize.outputs.shard-directory }}
      run: |
        set +e
        teardown_log="$E2E_SHARD_DIRECTORY/docker-compose-teardown.log"
        docker compose \
          --file "$E2E_COMPOSE_FILE" \
          --project-name "$E2E_COMPOSE_PROJECT" \
          down --volumes --remove-orphans > "$teardown_log" 2>&1
        teardown_exit_code=$?
        cat "$teardown_log"
        echo "exit-code=$teardown_exit_code" >> "$GITHUB_OUTPUT"
        exit "$teardown_exit_code"

    - name: Finalize shard results
      id: finalize
      if: always() && steps.initialize.outcome == 'success'
      shell: bash
      env:
        E2E_STATUS_FILE: ${{ steps.initialize.outputs.status-file }}
        E2E_RUNNER_DOWNLOAD_OUTCOME: ${{ inputs.runner-download-outcome }}
        E2E_RUNNER_LOAD_OUTCOME: ${{ inputs.runner-load-outcome }}
        E2E_RUNNER_EXIT_CODE: ${{ steps.runner.outputs.exit-code }}
        E2E_ACTUAL_RUNNER_IMAGE_ID: ${{ steps.runner.outputs.actual-image-id }}
        E2E_STARTUP_EXIT_CODE: ${{ steps.start.outputs.exit-code }}
        E2E_PLAYWRIGHT_EXIT_CODE: ${{ steps.playwright.outputs.exit-code }}
        E2E_PLAYWRIGHT_FAILURE_KIND: ${{ steps.playwright.outputs.failure-kind }}
        E2E_LOG_EXIT_CODE: ${{ steps.logs.outputs.exit-code }}
        E2E_TEARDOWN_EXIT_CODE: ${{ steps.teardown.outputs.exit-code }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/complete-shard.mjs" \
          "$E2E_STATUS_FILE" \
          "$E2E_RUNNER_DOWNLOAD_OUTCOME" \
          "$E2E_RUNNER_LOAD_OUTCOME" \
          "$E2E_RUNNER_EXIT_CODE" \
          "$E2E_ACTUAL_RUNNER_IMAGE_ID" \
          "$E2E_STARTUP_EXIT_CODE" \
          "$E2E_PLAYWRIGHT_EXIT_CODE" \
          "$E2E_PLAYWRIGHT_FAILURE_KIND" \
          "$E2E_LOG_EXIT_CODE" \
          "$E2E_TEARDOWN_EXIT_CODE" \
          "$GITHUB_OUTPUT"
        completion_exit_code=$?
        exit "$completion_exit_code"
