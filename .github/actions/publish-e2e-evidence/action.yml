name: Publish E2E Evidence
description: Finalize, publish, summarize, and enforce the authoritative E2E verdict.

inputs:
  evidence-directory:
    description: Repository-relative directory containing merged E2E evidence.
    required: false
    default: e2e-evidence
  expected-shards:
    description: Number of shard results required by the run.
    required: true
  artifact-name:
    description: Name of the durable merged evidence artifact.
    required: false
    default: e2e-evidence
  retention-days:
    description: Number of days GitHub retains the merged evidence artifact.
    required: false
    default: "10"
  runner-download-outcome:
    description: Outcome of downloading the immutable runner archive.
    required: true
  runner-load-outcome:
    description: Outcome of loading the immutable runner archive.
    required: true
  runner-verification-outcome:
    description: Outcome of verifying the loaded runner image ID.
    required: true
  shard-download-outcome:
    description: Outcome of downloading shard evidence.
    required: true
  merge-outcome:
    description: Outcome of deterministic evidence assembly.
    required: true
  report-publication-outcome:
    description: Outcome of building and publishing the report image archive.
    required: true

outputs:
  verdict:
    description: "Authoritative verdict: passed, failed, or infrastructure-error."
    value: ${{ steps.evaluate.outputs.verdict }}
  artifact-name:
    description: Merged evidence artifact name.
    value: ${{ inputs.artifact-name }}
  total:
    description: Aggregated test count.
    value: ${{ steps.evaluate.outputs.total }}
  passed:
    description: Aggregated passed test count.
    value: ${{ steps.evaluate.outputs.passed }}
  failed:
    description: Aggregated failed test count.
    value: ${{ steps.evaluate.outputs.failed }}
  skipped:
    description: Aggregated skipped test count.
    value: ${{ steps.evaluate.outputs.skipped }}
  verdict-file:
    description: Absolute path to the finalized verdict.json.
    value: ${{ steps.prepare.outputs.verdict-file }}

runs:
  using: composite
  steps:
    - id: prepare
      name: Finalize authoritative verdict
      shell: bash
      env:
        E2E_EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        E2E_EXPECTED_SHARDS: ${{ inputs.expected-shards }}
        E2E_RUNNER_DOWNLOAD_OUTCOME: ${{ inputs.runner-download-outcome }}
        E2E_RUNNER_LOAD_OUTCOME: ${{ inputs.runner-load-outcome }}
        E2E_RUNNER_VERIFICATION_OUTCOME: ${{ inputs.runner-verification-outcome }}
        E2E_SHARD_DOWNLOAD_OUTCOME: ${{ inputs.shard-download-outcome }}
        E2E_MERGE_OUTCOME: ${{ inputs.merge-outcome }}
        E2E_REPORT_PUBLICATION_OUTCOME: ${{ inputs.report-publication-outcome }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/prepare-publication.mjs" \
          "$GITHUB_WORKSPACE" \
          "$E2E_EVIDENCE_DIRECTORY" \
          "$E2E_EXPECTED_SHARDS" \
          "$E2E_RUNNER_DOWNLOAD_OUTCOME" \
          "$E2E_RUNNER_LOAD_OUTCOME" \
          "$E2E_RUNNER_VERIFICATION_OUTCOME" \
          "$E2E_SHARD_DOWNLOAD_OUTCOME" \
          "$E2E_MERGE_OUTCOME" \
          "$E2E_REPORT_PUBLICATION_OUTCOME" \
          "$GITHUB_OUTPUT"

    - id: publish
      name: Upload authoritative E2E evidence
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.prepare.outputs.evidence-directory }}/
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - id: evaluate
      name: Publish summary and enforce verdict
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      env:
        E2E_VERDICT_FILE: ${{ steps.prepare.outputs.verdict-file }}
        E2E_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        E2E_PUBLICATION_OUTCOME: ${{ steps.publish.outcome }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/evaluate-publication.mjs" \
          "$E2E_VERDICT_FILE" \
          "$E2E_ARTIFACT_NAME" \
          "${E2E_PUBLICATION_OUTCOME:-failure}" \
          "$GITHUB_STEP_SUMMARY" \
          "$GITHUB_OUTPUT"
